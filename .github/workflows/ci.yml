# Build and test Owelk on Linux, macOS and Windows. Every test runs offscreen; on Windows the install
# script (tools/install-local.ps1) runs too.
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: linux_gcc_64
          - os: macos-14
            arch: clang_64
          # Qt 6.11 for Windows sits in a folder layout aqtinstall 3.3.0 cannot read; this commit can
          # (the same one tools/install-local.ps1 uses). Back to the release once a newer one is out.
          - os: windows-2022
            arch: win64_msvc2022_64
            aqtsource: https://github.com/miurahr/aqtinstall/archive/076e1659807d0b362a3ed684d54c2e9c775eb9c7.zip
            py7zr: '>=1.1.3'
            # Text drawn under the offscreen platform reads back empty from PDFs on Windows.
            testPlatform: windows
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional == true }}
    env:
      QTWEBENGINE_DISABLE_SANDBOX: 1
      # No GPU on the runners (Windows' web engine otherwise stops trying to make one).
      QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox --disable-gpu
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2t64 libsecret-1-dev pkg-config libqpdf-dev

      - name: macOS tools
        if: runner.os == 'macOS'
        run: brew install ninja qpdf

      # The Qt installer (aqtinstall) needs packages that have no Python 3.14 wheels on Windows yet.
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          setup-python: false
          version: ${{ matrix.qt || '6.11.*' }}
          arch: ${{ matrix.arch }}
          aqtsource: ${{ matrix.aqtsource }}
          py7zrversion: ${{ matrix.py7zr || '==1.1.0' }}
          modules: 'qtpdf qtwebengine qtwebchannel qtpositioning qtimageformats qtshadertools'
          cache: true

      - name: MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Windows tools
        if: runner.os == 'Windows'
        run: python -m pip install ninja

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOWELK_TEST_PLATFORM=${{ matrix.testPlatform || 'offscreen' }}

      - name: Build
        id: build
        run: cmake --build build --parallel

      # Windows tests are not required yet: most of them still fail there (PDF text read back empty).
      - name: Test
        id: test
        continue-on-error: ${{ runner.os == 'Windows' }}
        run: ctest --test-dir build --output-on-failure --timeout 600

      # What a Windows user runs (Windows PowerShell 5.1), with the Qt this job already has.
      - name: Install script
        if: runner.os == 'Windows' && !cancelled() && steps.build.outcome == 'success'
        shell: powershell
        env:
          OWELK_QT: ${{ env.QT_ROOT_DIR }}
        run: |
          ./tools/install-local.ps1 -Yes
          if (-not (Test-Path "$env:LOCALAPPDATA/Programs/Owelk/bin/owelk.exe")) { exit 1 }
          if (-not (Test-Path "$env:APPDATA/Microsoft/Windows/Start Menu/Programs/Owelk.lnk")) { exit 1 }

      # Only the failing checks, short enough to paste into a report.
      - name: Failed checks
        if: failure() || steps.test.outcome == 'failure'
        shell: bash
        run: grep -hE "FAIL!|Loc:|QFATAL|Actual|Expected" build/test-results/*.txt build/Testing/Temporary/LastTest.log | head -150 || true
